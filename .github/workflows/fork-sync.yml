name: Sincronizar com upstream (melgarafael)

# Traz a main do Rafael pra dentro da sua main automaticamente, sem force-push
# e sem apagar trabalho: é sempre `merge`, nunca `reset`. Se der conflito, o
# job falha e o GitHub avisa por e-mail — ninguém escolhe lado no automático.
#
# Escreve com token de GitHub App (FORK_SYNC_APP_ID / FORK_SYNC_APP_PRIVATE_KEY),
# nunca GITHUB_TOKEN — mesmo padrão do release.yml. Razão: quando o merge do
# upstream toca .github/workflows/*, GitHub recusa push de GITHUB_TOKEN
# mesmo com `contents: write` (medido no run 33397579685); `workflows: write`
# não existe como chave de `permissions:` do workflow, só como escopo de
# PAT/App. Sem o App configurado (secrets ausentes), o job falha cedo com
# "appId option is required" e a sincronização vira manual (`gh api
# repos/<fork>/merge-upstream -f branch=main`).

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC todo dia
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ secrets.FORK_SYNC_APP_ID }}
          private-key: ${{ secrets.FORK_SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.token.outputs.token }}

      - name: Configurar git
        run: |
          git config user.name "fork-sync[bot]"
          git config user.email "${{ steps.token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Buscar upstream
        run: |
          git remote add upstream https://github.com/melgarafael/DeskcommCRM.git
          git fetch upstream main

      - name: Mesclar upstream/main na main
        run: |
          set -e
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "já está atualizado, nada a mesclar"
            exit 0
          fi
          git merge upstream/main --no-edit

      - name: Publicar
        run: git push origin main
