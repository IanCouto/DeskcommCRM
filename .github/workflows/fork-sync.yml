name: Sincronizar com upstream (melgarafael)

# Traz a main do Rafael pra dentro da sua main automaticamente, sem force-push
# e sem apagar trabalho: é sempre `merge`, nunca `reset`. Se der conflito, o
# job falha e o GitHub avisa por e-mail — ninguém escolhe lado no automático.
#
# `workflows: write` além de `contents: write`: o upstream mexe com frequência
# em .github/workflows/*, e o GitHub recusa push de GITHUB_TOKEN que toque
# arquivo de workflow sem esse escopo extra, mesmo com contents: write —
# medido no run 33397579685 ("refusing to allow a GitHub App to create or
# update workflow ... without `workflows` permission").

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC todo dia
  workflow_dispatch: {}

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar git
        run: |
          git config user.name "fork-sync[bot]"
          git config user.email "actions@github.com"

      - name: Buscar upstream
        run: |
          git remote add upstream https://github.com/melgarafael/DeskcommCRM.git
          git fetch upstream main

      - name: Mesclar upstream/main na main
        run: |
          set -e
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "já está atualizado, nada a mesclar"
            exit 0
          fi
          git merge upstream/main --no-edit

      - name: Publicar
        run: git push origin main
