name: Sincronizar com upstream (melgarafael)

# Traz a main do Rafael pra dentro da sua main automaticamente, sem force-push
# e sem apagar trabalho: é sempre `merge`, nunca `reset`. Se der conflito, o
# job falha e o GitHub avisa por e-mail — ninguém escolhe lado no automático.
#
# LIMITAÇÃO CONHECIDA: quando o merge do upstream toca .github/workflows/*,
# o push falha — GITHUB_TOKEN não pode escrever workflow, e isso não é
# concedível via `permissions:` (testado: `workflows: write` é rejeitado como
# chave inválida pelo próprio schema; o run 33397579685 mostrou o erro real,
# "refusing to allow a GitHub App to ... without `workflows` permission", que
# só se resolve com PAT com escopo `workflow` ou GitHub App — nenhum dos dois
# configurado neste fork). Nesses dias o job falha, avisa por e-mail, e a
# sincronização vira manual (`gh api repos/<fork>/merge-upstream -f branch=main`).

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC todo dia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar git
        run: |
          git config user.name "fork-sync[bot]"
          git config user.email "actions@github.com"

      - name: Buscar upstream
        run: |
          git remote add upstream https://github.com/melgarafael/DeskcommCRM.git
          git fetch upstream main

      - name: Mesclar upstream/main na main
        run: |
          set -e
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "já está atualizado, nada a mesclar"
            exit 0
          fi
          git merge upstream/main --no-edit

      - name: Publicar
        run: git push origin main
